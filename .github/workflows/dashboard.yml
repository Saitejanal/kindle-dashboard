name: Build dashboard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      litter_cleaned:
        description: "Type yes to mark the litter box cleaned today"
        required: false
        default: "no"

permissions:
  contents: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get install -y fonts-dejavu-core
          pip install pillow icalendar recurring-ical-events

      - name: Mark litter box cleaned
        if: ${{ github.event.inputs.litter_cleaned == 'yes' }}
        run: |
          TODAY=$(TZ=America/New_York date +%F)
          echo "{\"litter_last_cleaned\": \"$TODAY\"}" > state.json

      - name: Generate dashboard
        env:
          CALENDAR_URL: ${{ secrets.CALENDAR_URL }}
        run: python generate.py

      - name: Save the picture
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add dash.png
          if [ -f state.json ]; then git add state.json; fi
          git diff --cached --quiet || git commit -m "Update dashboard"
          git push
